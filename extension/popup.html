<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="popup.css" />
  <title> Voxa </title>
</head>

<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <span><i class="fas fa-eye"></i> Voxa </span>
    <label class="switch">
      <input type="checkbox" id="themeToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <!-- Reading Controls -->
  <div class="section">
    <h3>Reading Controls</h3>
    <div class="controls-grid">
      <button id="readPage"><i class="fas fa-play"></i> Read</button>
      <button id="pauseResume"><i class="fas fa-pause"></i> Pause</button>
      <button id="stop"><i class="fas fa-stop"></i> Stop</button>
      <button id="resetAllBtn"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      <button id="summarizePage"><i class="fas fa-compress"></i> Summarize</button>
    </div>
  </div>

  <!-- Accessibility Settings -->
  <div class="section">
    <h3>Accessibility</h3>

    <div class="slider-group">
      <label>Speed <span id="speedVal">1x</span></label>
      <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label>Pitch <span id="pitchVal">1x</span></label>
      <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
    </div>

    <div class="slider-group">
      <label>Contrast <span id="contrastVal">100%</span></label>
      <input type="range" id="contrast" min="50" max="200" value="100">
    </div>

    <div class="slider-group">
      <label>Color Filter</label>
      <select id="colorFilter">
        <option value="none">None</option>
        <option value="grayscale(100%)">Grayscale</option>
        <option value="invert(100%)">Invert</option>
        <option value="sepia(100%)">Sepia</option>
        <option value="contrast(150%)">High Contrast</option>
      </select>
    </div>

    <div class="slider-group">
      <label>Voice</label>
      <select id="voiceSelect"></select>
    </div>

    <div class="slider-group">
      <label>Reset Option</label>
      <select id="resetSelect">
        <option value="">Select</option>
        <option value="speed">Speed</option>
        <option value="pitch">Pitch</option>
        <option value="contrast">Contrast</option>
        <option value="colorFilter">Color Filter</option>
        <option value="voice">Voice</option>
      </select>
    </div>
  </div>

  <!-- =========================
       FOOTER (NEW CLEAN LAYOUT)
  ========================== -->
  <div class="popup-footer">

  <!-- 👍 👎 FEEDBACK -->
  <div class="footer-feedback">
    <button id="thumbUp" class="icon-btn like">
      <i class="fas fa-thumbs-up"></i>
    </button>

    <button id="thumbDown" class="icon-btn dislike">
      <i class="fas fa-thumbs-down"></i>
    </button>
  </div>

  <!-- NAVIGATION BUTTONS -->
  <div class="footer-nav">

  <button id="voiceAssistant" class="footer-btn">
    <i class="fas fa-microphone"></i>
  </button>

  <button id="openHistory" class="footer-btn">
    <i class="fa-solid fa-clock"></i>
  </button>

  <button id="openDashboard" class="footer-btn">
    <i class="fas fa-tachometer-alt"></i>
  </button>

  <button id="openFeedbackPage" class="footer-btn">
    <i class="fas fa-comments"></i>
  </button>

</div>

  <!-- ✅ MOVE TOAST HERE -->
  <div id="toast" class="toast hidden"></div>

</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
